<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Bautista | Simulador de Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d7d;
            --primary-glow: rgba(255, 77, 125, 0.4);
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2rem; margin-bottom: 1.5rem; color: var(--primary); font-weight: 600; text-align: center; }
        
        .section { margin-bottom: 2rem; padding: 1.5rem; background: rgba(0,0,0,0.2); border-radius: 16px; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; }
        
        input, select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--primary-glow); }
        .btn-secondary { background: #334155; color: white; }

        .item-row { display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
        .remove-btn { color: #f87171; cursor: pointer; padding: 0.5rem; }

        .log {
            background: #000;
            border-radius: 12px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            height: 150px;
            overflow-y: auto;
            color: #4ade80;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 Simulador de Ventas</h1>

    <div class="section">
        <label>Pegar Token JWT de Admin/Empleado:</label>
        <input type="password" id="token" placeholder="Bearer eyJhbGciOiJIUzI1Ni...">
    </div>

    <div class="grid">
        <div class="section">
            <h3>👤 Datos del Cliente</h3>
            <label>Nombre:</label>
            <input type="text" id="nombreCliente" placeholder="Ej: Juan Pérez">
            <label>Teléfono:</label>
            <input type="text" id="telefono" placeholder="Ej: 3311223344">
        </div>

        <div class="section">
            <h3>📍 Entrega</h3>
            <label>Dirección (Calle y Número):</label>
            <input type="text" id="calle" placeholder="Avenida Juárez 123">
            <label>Colonia:</label>
            <input type="text" id="colonia" placeholder="Centro">
        </div>
    </div>

    <div class="section">
        <h3>💐 Productos en la Venta</h3>
        <div id="itemsContainer">
            <div class="item-row">
                <div style="flex: 2">
                    <label>Insumo/Producto:</label>
                    <select class="product-select"><option value="">Cargando...</option></select>
                </div>
                <div style="flex: 1">
                    <label>Cantidad:</label>
                    <input type="number" class="item-qty" value="1" min="1">
                </div>
                <span class="remove-btn" onclick="this.parentElement.remove()">✕</span>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="addItem()" style="padding: 0.5rem 1rem; margin-top: 1rem;">+ Añadir otro producto</button>
    </div>

    <div class="grid">
        <button class="btn btn-secondary" onclick="simularAleatorio()">🎲 Generar Datos Aleatorios</button>
        <button class="btn btn-primary" onclick="enviarVenta()">🚀 Registrar Venta Manual</button>
    </div>

    <div class="log" id="log">Monitor de actividades: Listo para procesar ventas.</div>
</div>

<script>
    let products = [];
    const API_URL = 'http://localhost:5000/api';

    async function loadProducts() {
        try {
            // Solo cargamos productos activos para la venta
            const resp = await fetch(`${API_URL}/products?size=100`);
            const json = await resp.json();
            
            // Garantizamos que solo se listen los que el backend marca como activos
            products = json.data.items.filter(p => p.activo !== false);
            
            document.querySelectorAll('.product-select').forEach(select => updateSelect(select));
            log(`📦 Catálogo sincronizado: ${products.length} productos activos encontrados.`);
        } catch (e) {
            log("Error cargando productos. ¿El backend está corriendo?", "red");
        }
    }

    function updateSelect(select) {
        select.innerHTML = '<option value="">-- Seleccionar --</option>' + 
            products.map(p => {
                const precio = p.precioBase || 0;
                return `<option value="${p.id}">${p.nombre} ($${precio.toLocaleString()})</option>`;
            }).join('');
    }

    function addItem() {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <div style="flex: 2">
                <select class="product-select"></select>
            </div>
            <div style="flex: 1">
                <input type="number" class="item-qty" value="1" min="1">
            </div>
            <span class="remove-btn" onclick="this.parentElement.remove()">✕</span>
        `;
        document.getElementById('itemsContainer').appendChild(div);
        updateSelect(div.querySelector('.product-select'));
    }

    function log(msg, color = '#4ade80') {
        const l = document.getElementById('log');
        l.innerHTML += `<div style="color: ${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        l.scrollTop = l.scrollHeight;
    }

    function simularAleatorio() {
        const nombres = ["Ana Martínez", "Roberto Gómez", "Elena Castillo", "Carlos Sánchez", "Sofía Ruíz"];
        const calles = ["Zapata #45", "Independencia 1022", "Hidalgo 567", "Plan de San Luis 89"];
        const colonias = ["La Estancia", "Americana", "Providencia", "Puerta de Hierro"];

        document.getElementById('nombreCliente').value = nombres[Math.floor(Math.random()*nombres.length)];
        document.getElementById('telefono').value = "33" + Math.floor(Math.random()*10000000);
        document.getElementById('calle').value = calles[Math.floor(Math.random()*calles.length)];
        document.getElementById('colonia').value = colonias[Math.floor(Math.random()*colonias.length)];
        
        if(products.length > 0) {
            const selects = document.querySelectorAll('.product-select');
            selects[0].value = products[Math.floor(Math.random()*products.length)].id;
        }
        log("🎲 Datos aleatorios generados. Presiona 'Registrar Venta' para procesar.");
    }

    async function enviarVenta() {
        const token = document.getElementById('token').value;
        if(!token) {
            alert("⚠️ Por favor pega tu Token JWT en el campo superior.");
            return;
        }

        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            const pId = row.querySelector('.product-select').value;
            const qty = row.querySelector('.item-qty').value;
            if(pId) items.push({ productId: pId, cantidad: parseInt(qty) });
        });

        if(items.length === 0) { alert("Añade al menos un producto."); return; }

        const payload = {
            nombreCliente: document.getElementById('nombreCliente').value,
            telefono: document.getElementById('telefono').value,
            fechaEntrega: new Date().toISOString().split('T')[0],
            horaEntrega: "12:00:00",
            tipoPedido: "INSTANTANEO",
            notas: "Venta simulada desde herramienta de pruebas",
            direccion: {
                calle: document.getElementById('calle').value,
                colonia: document.getElementById('colonia').value,
                municipio: "Arandas",
                estado: "Jalisco",
                cp: "47170",
                referencias: "Venta de mostrador"
            },
            items: items
        };

        try {
            const response = await fetch(`${API_URL}/orders/physical`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token.startsWith('Bearer') ? token : `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if(result.success) {
                log(`✅ VENTA EXITOSA! Pedido: ${result.data.id} - Total: $${result.data.total}`);
            } else {
                log(`❌ ERROR: ${result.message}`, "red");
            }
        } catch (e) {
            log(`❌ Error crítico de red: ${e.message}`, "red");
        }
    }

    loadProducts();
</script>

</body>
</html>
