services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floreria_api
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Backups persistentes fuera del contenedor
      - ./backups:/app/backups
      # Token de Google Drive (se genera la primera vez)
      - ./google_token.json:/app/google_token.json
      # Credenciales de Google Drive
      - ./google_credentials.json:/app/google_credentials.json
    restart: unless-stopped
    networks:
      - floreria_net

networks:
  floreria_net:
    driver: bridge
