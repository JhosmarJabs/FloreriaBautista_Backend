services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: Backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/obj
      - /app/bin
      - ./backups:/app/backups
      - ./google_token.json:/app/google_token.json
      - ./google_credentials.json:/app/google_credentials.json
    restart: unless-stopped
    networks:
      - floreria_net

networks:
  floreria_net:
    driver: bridge